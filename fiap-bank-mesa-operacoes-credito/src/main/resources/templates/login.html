<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAP Bank - Acesso à Mesa de Operações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ed1c24;
            --primary-dark: #b8141a;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card-custom {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 32px;
            width: 100%;
            max-width: 420px;
        }

        .fiap-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .fiap-brand span {
            color: var(--primary-color);
        }

        .form-label,
        .subtitle {
            color: var(--text-muted);
        }

        .form-control-dark {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
        }

        .form-control-dark:focus {
            background-color: #0f172a;
            color: var(--text-main);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(237, 28, 36, 0.25);
        }

        .btn-login {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
            color: #ffffff;
        }
    </style>
</head>
<body>

<main class="card-custom">
    <div class="fiap-brand fs-3 mb-1">
        <i class="fa-solid fa-university me-2 text-danger"></i>FIAP <span>BANK</span>
    </div>
    <p class="subtitle small mb-4">Mesa de Operações de Crédito</p>

    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-1"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold" for="email">E-mail</label>
            <input id="email" name="email" type="email" class="form-control form-control-dark"
                   autocomplete="username" required autofocus>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold" for="senha">Senha</label>
            <input id="senha" name="senha" type="password" class="form-control form-control-dark"
                   autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-login w-100 py-2">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
        </button>
    </form>
</main>

</body>
</html>
