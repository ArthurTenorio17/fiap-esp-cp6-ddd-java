server:
  port: 8082

spring:
  application:
    name: fiap-bank-mesa-operacoes-credito
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

plataforma:
  credito:
    url: ${PLATAFORMA_CREDITO_URL:http://localhost:8081}

mesa:
  auth:
    # Use true quando a Mesa for servida por HTTPS.
    cookie-secure: ${MESA_COOKIE_SECURE:false}
